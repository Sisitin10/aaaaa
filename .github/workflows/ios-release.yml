name: Build and release iOS IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build iPhone app
    runs-on: macos-26
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: ios-release-main
      cancel-in-progress: true

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Build unsigned iOS app
        run: |
          xcodebuild \
            -project RealCam.xcodeproj \
            -scheme RealCamFH6 \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/RealCamDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          APP_PATH="$RUNNER_TEMP/RealCamDerivedData/Build/Products/Release-iphoneos/RealCamFH6.app"
          IPA_ROOT="$RUNNER_TEMP/RealCamIPA"

          test -d "$APP_PATH"
          mkdir -p "$IPA_ROOT/Payload"
          ditto "$APP_PATH" "$IPA_ROOT/Payload/RealCamFH6.app"
          ditto -c -k --sequesterRsrc --keepParent \
            "$IPA_ROOT/Payload" \
            "$GITHUB_WORKSPACE/RealCamFH6-unsigned.ipa"

      - name: Create or refresh the latest build release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="continuous"
          RELEASE_TITLE="RealCam FH6 - Latest build"
          RELEASE_NOTES="Automatically updated from main at commit $GITHUB_SHA. This IPA is unsigned."
          IPA_PATH="$GITHUB_WORKSPACE/RealCamFH6-unsigned.ipa"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TITLE" \
              --notes "$RELEASE_NOTES" \
              --prerelease
            gh release upload "$RELEASE_TAG" "$IPA_PATH" --clobber
          else
            gh release create "$RELEASE_TAG" "$IPA_PATH" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TITLE" \
              --notes "$RELEASE_NOTES" \
              --prerelease \
              --latest=false
          fi
